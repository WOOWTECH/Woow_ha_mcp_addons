          a forwarding slot not free within 1 second gives -32003.
          Each additional profile has 32 and 8 streams of its own; the outer bound is 224 connections. Pending replies
          are capped at 32 MiB per profile (soft). Identified POST requests other than initialize and ping also hold
          64 MiB reservations: at most 3 for the default profile, 1 per additional profile, and 512 MiB (8
