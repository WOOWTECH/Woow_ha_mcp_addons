# Publishes the seven MCP Server add-ons (addons/*) to the WOOW HA App Store and its Local Download
# (owner decision 2026-10-09). The reusable publisher runs the Store's own tooling and registry; the Store
# consumer re-validates every notification (source commit, context checksums, publisher run on this repository's
# default branch, and the published GHCR images per architecture). This repository keeps its own add-on store as
# well. The Store ships only stable Releases, which woow-addon-release.yml publishes after its checks; this
# workflow follows it on workflow_run, because a Release made with GITHUB_TOKEN triggers no other workflow.
name: WOOW addon source notification
'on':
  push:
    branches:
    - claude-delivery
  workflow_dispatch: {}
  schedule:
  - cron: 41 */6 * * *
  workflow_run:
    workflows:
    - WOOW addon release
    types:
    - completed
permissions:
  contents: write
  actions: read
concurrency:
  group: woow-addon-source-notification
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/claude-delivery' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion ==
      'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.event != 'pull_request_target'
      && github.event.workflow_run.head_repository.full_name == github.repository))
    uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-publish.yml@main
  # Ask the Store to synchronize now instead of at its next (often hours-late)
  # schedule. Runs only when publish wrote a new notification; the Store
  # re-validates everything, so the dispatch carries no payload.
  notify-store:
    needs: publish
    if: needs.publish.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
    - name: Send woow-addon-ready to the Store
      env:
        GH_TOKEN: ${{ secrets.APP_STORE_DISPATCH_TOKEN }}
      run: |
        if [ -z "$GH_TOKEN" ]; then
          echo "::warning title=Store not notified::APP_STORE_DISPATCH_TOKEN is not set; the Store takes this version at its next scheduled synchronization."
          exit 0
        fi
        gh api --method POST repos/WOOWTECH/Woow_HA_App_Store/dispatches -f event_type=woow-addon-ready
